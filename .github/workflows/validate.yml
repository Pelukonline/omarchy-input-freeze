name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install linters
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Validate manifest
        run: |
          jq -e '
            .schemaVersion == 1 and
            .id == "io.github.pelukonline.input-freeze" and
            .kinds == ["bar-widget"] and
            .entryPoints.barWidget == "BarWidget.qml"
          ' manifest.json
      - name: Validate shell helper
        run: |
          bash -n input-freeze
          shellcheck input-freeze
